{% load static %}
<!DOCTYPE html>
<html lang="uk" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Резюме{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6">
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="atmosphere" aria-hidden="true"></div>

<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <div class="cp-menu">
            <a class="navbar-brand" href="{% url 'main:index' %}">
                {{ nickname|default:"Резюме" }}
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Відкрити меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#about">Про себе</a></li>
                    <li class="nav-item"><a class="nav-link" href="#education">Освіта</a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills">Навички</a></li>
                    <li class="nav-item"><a class="nav-link" href="#projects">Проєкти</a></li>
                </ul>
            </div>
            <span class="menu-accent" aria-hidden="true"></span>
            <a class="menu-buy" href="{{ github_url|default:'https://github.com/MEEDUSTER' }}" target="_blank" rel="noopener">GitHub</a>
        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer-custom">
    <div class="footer-razor" aria-hidden="true"></div>
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 footer-inner">
        <span>&copy; {% now "Y" %} {{ nickname|default:"MEEDUSTER" }}</span>
        <span class="footer-meta">Персональне резюме</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function () {
    var nav = document.querySelector(".navbar-custom");
    var links = Array.prototype.slice.call(
        document.querySelectorAll('.navbar-custom .nav-link[href^="#"]')
    );
    var sections = links
        .map(function (l) { return document.querySelector(l.getAttribute("href")); })
        .filter(Boolean);

    function onScroll() {
        if (nav) nav.classList.toggle("is-scrolled", window.scrollY > 24);
        if (!sections.length) return;
        var y = window.scrollY + 130;
        var current = sections[0];
        for (var i = 0; i < sections.length; i++) {
            if (sections[i].offsetTop <= y) current = sections[i];
        }
        links.forEach(function (l) {
            l.classList.toggle("is-active", current && l.getAttribute("href") === "#" + current.id);
        });
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
})();
</script>

</body>
</html>
