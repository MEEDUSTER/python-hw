{% extends "main/layout.html" %}

{% block title %}Історичні фотографії — Вінниця{% endblock %}

{% block content %}

<p class="subnav">
    <a href="{% url 'history' %}">Загальна інформація</a>

    <a href="{% url 'history_photos' %}">Історичні фотографії</a>

<div class="photos">

    <figure>
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Old_Tower_night_winter_2011_G1.jpg?width=800" alt="Стара водонапірна вежа у Вінниці">
