{% extends "base.html" %}

{% block title %}{{ product.title }} — Магазин{% endblock %}

{% block content %}
<p><a href="{{ url_for('index') }}">← Назад до списку</a></p>

<article class="product-card">
    <img src="{{ product.image }}" alt="{{ product.title }}">
    <div>
        <h1>{{ product.title }}</h1>
        <p class="rating">Оцінка: {{ product.rating }} / 5</p>
        <p class="price">{{ "%.2f"|format(product.price) }} грн</p>
    </div>
</article>
{% endblock %}
